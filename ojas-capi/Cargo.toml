[package]
name = "ojas-capi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "In-process training and inference opcodes for the Go API."

[dependencies]
gusset = { package = "gusset", path = "../../../devtools/gusset/crates/gusset" }
ojas-core = { path = "../ojas-core" }
ojas-cpu = { path = "../ojas-cpu" }
ojas-data = { path = "../ojas-data" }
ojas-device = { path = "../ojas-device" }
ojas-infer = { path = "../ojas-infer" }
ojas-io = { path = "../ojas-io" }
ojas-model = { path = "../ojas-model" }
ojas-wgpu = { path = "../ojas-wgpu" }

[target.'cfg(target_os = "macos")'.dependencies]
ojas-metal = { path = "../ojas-metal" }
