[package]
name = "ojas-autograd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tape autograd. CPU gradcheck; GPU backends upload."

[dependencies]
ojas-core = { path = "../ojas-core" }
ojas-cpu = { path = "../ojas-cpu" }
ojas-kernels = { path = "../ojas-kernels" }

[dev-dependencies]
ojas-wgpu = { path = "../ojas-wgpu" }

# The G6 seeded-backward gate on a real Metal device (`tests/metal_tape.rs`).
# A workspace member, so no new third-party dependency.
[target.'cfg(target_os = "macos")'.dev-dependencies]
ojas-metal = { path = "../ojas-metal" }
