name: Deploy ojas Documentation to vbcr.dev

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - '*/README.md'
      - 'scripts/sitegen/**'
      - 'scripts/benchreport/**'
      - 'bench/results/**'
      - 'Cargo.toml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"

jobs:
  # The site is generated from the markdown. Publishing a tree whose generated
  # files are stale, or whose links point at nothing, is refused here.
  check:
    name: sitegen (vet, test, check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go vet
        run: go vet scripts/sitegen/main.go
      - name: go test
        run: go test -count=1 scripts/sitegen/main.go scripts/sitegen/main_test.go
      - name: site is generated from the markdown
        run: go run scripts/sitegen/main.go -check
      - name: benchreport vet and test
        run: |
          go vet scripts/benchreport/main.go scripts/benchreport/main_test.go
          go test -count=1 scripts/benchreport/main.go scripts/benchreport/main_test.go
      - name: bench charts are generated from bench/results
        run: go run scripts/benchreport/main.go plots -check

  deploy:
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enable_cname: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
