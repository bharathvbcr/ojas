[package]
name = "ojas-device"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Explicit device selection. No silent CPU fallback."

[dependencies]
ojas-core = { path = "../ojas-core" }

# libc 0.2.189 is already in Cargo.lock. Used for the macOS sysctls and,
# on Linux, `sysconf(_SC_PAGESIZE)`; `getloadavg` on both.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2.189"
