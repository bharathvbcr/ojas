[package]
name = "ojas-device"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Explicit device selection. No silent CPU fallback."

[dependencies]
ojas-core = { path = "../ojas-core" }

# libc 0.2.189 is already in Cargo.lock. Used only for the macOS host probe.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
