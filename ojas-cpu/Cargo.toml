[package]
name = "ojas-cpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "CPU reference backend. Lane A."

[dependencies]
ojas-core = { path = "../ojas-core" }

# Fast-tier GEMM. Accelerate is macOS-only; ojas-simd refuses the feature
# elsewhere with a compile error.
[target.'cfg(target_os = "macos")'.dependencies]
ojas-simd = { path = "../ojas-simd", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ojas-simd = { path = "../ojas-simd" }
