[package]
name = "ojas-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NVIDIA CUDA device. The cuda feature is off unless requested."

[features]
default = []
# Links cudarc. Off by default so a host without the CUDA driver still tests.
cuda = ["dep:cudarc"]

[dependencies]
ojas-device = { path = "../ojas-device" }
ojas-kernels = { path = "../ojas-kernels" }
# crates.io cudarc 0.19.10, published 2026-09-24.
# driver + fallback-dynamic-loading: the safe driver API, loaded at runtime.
# cublas and the other default libraries stay off.
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "fallback-dynamic-loading",
    # Binding set only. Dynamic loading does not need nvcc. This is not a
    # claim that a device was opened.
    "cuda-12080",
] }
