[package]
name = "ojas-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NVIDIA CUDA device, Backend implementation, and whole-step training provider. The cuda feature is off unless requested."

[features]
default = []
# Links cudarc. Off by default so a host without the CUDA driver still tests.
cuda = ["dep:cudarc"]
# The parity ladder (K0-K11 and K2(i) wrappers the step provider does not call
# yet, host references, goldens, fixtures) and what the rung binaries share
# (smokes, report CLI, json, npy). Not part of the library API; the bins
# require it and this crate's own tests turn it on (dev-dependency below).
harness = []

[dependencies]
ojas-core = { path = "../ojas-core" }
ojas-device = { path = "../ojas-device" }
ojas-kernels = { path = "../ojas-kernels" }
ojas-io = { path = "../ojas-io" }
# crates.io cudarc 0.19.10, published 2026-09-24.
# driver + cublas + fallback-dynamic-loading: the safe driver API, loaded at runtime.
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cublas",
    "fallback-dynamic-loading",
    # Binding set only. Dynamic loading does not need nvcc. This is not a
    # claim that a device was opened.
    "cuda-12080",
] }

[dev-dependencies]
# The crate itself with `harness`, so its unit and integration tests see the
# ladder and the harness while the library's default build does not.
ojas-cuda = { path = ".", features = ["harness"] }

[[bin]]
name = "rung0"
path = "src/bin/rung0.rs"
required-features = ["cuda", "harness"]

[[bin]]
name = "runga"
path = "src/bin/runga.rs"
required-features = ["cuda", "harness"]
