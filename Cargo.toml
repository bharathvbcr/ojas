[workspace]
resolver = "2"
members = [
    "ojas-core",
    "ojas-cpu",
    "ojas-autograd",
    "ojas-oracle",
    "ojas-data",
    "ojas-io",
    "ojas-infer",
    "ojas-metal",
    "ojas-device",
    "ojas-kernels",
    "ojas-wgpu",
    "ojas-cuda",
    "ojas-hip",
    "ojas-capi",
    "ojas-gusset-engine",
    "ojas-simd",
    "ojas-qwen35",
    "ojas-model",
    "ojas-train",
    "ojas-cluster",
    "ojas-test-support",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# MSRV is 1.100 (owner override, 2026-11-12). It was 1.97, gusset's floor; gusset
# itself and tessl moved to 1.100 in the same change, and tessl's own floor must not
# sit below this one because it path-depends on ojas-core and ojas-io. wgpu 30.0.1
# declares rust-version = "1.87.0", which this floor also covers. Do not lower this
# field below gusset's rust-version.
rust-version = "1.100"
publish = false

# panic = "unwind" is Cargo's default. It is set here so a profile cannot
# switch the libraries to abort.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
overflow-checks = true
