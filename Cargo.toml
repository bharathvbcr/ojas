[workspace]
resolver = "2"
members = [
    "ojas-core",
    "ojas-cpu",
    "ojas-autograd",
    "ojas-oracle",
    "ojas-data",
    "ojas-io",
    "ojas-infer",
    "ojas-metal",
    "ojas-device",
    "ojas-kernels",
    "ojas-wgpu",
    "ojas-cuda",
    "ojas-hip",
    "ojas-capi",
    "ojas-gusset-engine",
    "ojas-simd",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# MSRV is 1.97 because the gusset path dependency declares rust-version = "1.97"
# (verified in the sibling gusset workspace Cargo.toml). wgpu 30.0.1 declares
# rust-version = "1.87.0", which this floor also covers. Do not lower this
# field below gusset's rust-version.
rust-version = "1.97"
publish = false

# panic = "unwind" is Cargo's default. It is set here so a profile cannot
# switch the libraries to abort.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
overflow-checks = true
