[package]
name = "ojas-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Oracle fixtures (fp64 rows, torch golden fixtures for the nanolab GPT) and the parity gates."

[dependencies]
ojas-core = { path = "../ojas-core" }
ojas-io = { path = "../ojas-io" }

[dev-dependencies]
ojas-cpu = { path = "../ojas-cpu" }
ojas-data = { path = "../ojas-data" }

# Dumps ojas-data BatchSampler starts for the torch oracle. `test = true`
# runs its unit tests under `cargo test -p ojas-oracle`.
[[example]]
name = "dump_batch_starts"
test = true
