[package]
name = "ojas-qwen35-cuda"
version = "0.1.0"
# Explicit rather than `*.workspace = true`: this crate builds standalone (see
# the `[workspace]` table below), and these are the values the ojas workspace sets.
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false
description = "Qwen3.5 whole-step training provider on CUDA (design B), the counterpart of ojas-qwen35. Not an ojas Backend."

# Standalone sibling crate (user decision, 2026-10-01): no ojas workspace member
# edit and no file outside this directory. The ojas coordinator merges it into
# ojas-cuda / ojas-kernels later; at that merge this table and the standalone
# Cargo.lock go, and ojas-cuda's cudarc pin moves to the same `cuda-12080`.
[workspace]

[features]
default = []
# Links cudarc. Off by default, so a host without the CUDA driver (the Mac)
# builds and runs every host-side test.
cuda = ["dep:cudarc"]

[dependencies]
# No direct ojas-core: it was a scaffold dependency nothing used, removed by the
# lead's ruling (2026-10-01, L-cuda-M1). It comes in through ojas-io.
# ojas-io: the canonical safetensors reader in ojas (BF16/F32/I64, bounded
# header), for the tiny-fixture loader and K11's device golden. Approved by the
# lead 2026-10-01 (L-cuda-M1); ojas-cuda has it at the coordinator's merge.
ojas-io = { path = "../ojas-io" }
# crates.io cudarc 0.19.10, the version ojas-cuda already locks.
# - `cuda-12080`: the GH200's user-space libraries are CUDA 12.8 (venv
#   libcublas.so.12, libnvrtc.so.12 with nvrtc-builtins 12.8; driver 580.105.08,
#   driver API 13.0). A 13.x-only symbol would panic at its first call.
# - `cublas`: the user chose cuBLAS for GEMM (2026-10-01).
# - `fallback-dynamic-loading`: the libraries are opened at runtime, so no nvcc
#   or CUDA toolkit is needed to build. Building is not a claim that a device opened.
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cublas",
    "fallback-dynamic-loading",
    "cuda-12080",
] }

[[bin]]
# The rung-0 smoke binary for the GH200 (README "Rung 0 on the box").
name = "rung0"
path = "src/bin/rung0.rs"
required-features = ["cuda"]

[[bin]]
# Rung (a)'s device run: every M0 and M1 check plus K2(i)'s, one report
# (README "Runga on the box").
name = "runga"
path = "src/bin/runga.rs"
required-features = ["cuda"]

[dev-dependencies]

# Mirrors the ojas workspace profiles, so behaviour does not change when this
# crate is merged.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
overflow-checks = true
