[package]
name = "tessl-arch02"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "From-scratch Metal training stack for arch_02 (Phase 4: bf16 + full-run)"
publish = false

[lib]
name = "tessl_arch02"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "verify_mixers"
path = "src/bin/verify_mixers.rs"

[[bin]]
name = "bench_conv1d"
path = "src/bin/bench_conv1d.rs"




[dependencies]
tessl = { path = "/Users/bharath/Code/research/tessl" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSData", "NSValue", "NSRange"] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLAllocation",
    # Classic MTLCommandQueue/Buffer/Encoder/ComputeCommandEncoder pruned —
    # training encode is Metal 4 only (MTL4*).
    "MTLComputePipeline",
    "MTLTypes",
    "MTLGPUAddress",
    "MTLEvent",
    "MTLResidencySet",
    "MTL4CommandQueue",
    "MTL4CommandBuffer",
    "MTL4CommandAllocator",
    "MTL4CommandEncoder",
    "MTL4ComputeCommandEncoder",
    "MTL4ArgumentTable",
    "MTL4Counters",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
